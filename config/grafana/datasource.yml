apiVersion: 1

datasources:
  - name: Prometheus
    orgId: 1

    # This ID is referenced by dashboards, which unfortunately makes it
    # difficult for us to change it to something actually unique.
    uid: my_unique_uid

    type: prometheus
    url: http://prometheus:9090/prometheus

    # Proxy requests to Prometheus through the Grafana server, instead of
    # making browsers talk directly to the Prometheus server.
    access: proxy

    # Prevent edits from the Web UI: we want all configuration to come from
    # this file.
    editable: false

    jsonData:
      # This needs to match the prometheus configuration
      # It is used to derive the $__rate_interval variable.
      timeInterval: 1m
  
  # probably from https://github.com/grafana/adventure/blob/main/grafana/datasources/default.yml
  - name: loki
    orgId: 1 # the default value is 1 https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
    type: loki
    # access: proxy # does this require updates to nginx.conf?
    # replacing localhost with 172.17.0.1 worked;
    # then with 'loki' ensures container-to-container communication as opposed to going via host.
    url: http://loki:3100
    editable: false
    jsonData: # https://grafana.com/docs/grafana/latest/datasources/loki/
      timeout: 60 # Request timeout in seconds.
      # The following property looks questionable and is not documented: https://community.grafana.com/t/no-documentation-for-maxlines-loki-data-source/105750
      # But there is a clue at the grafana dashboard > connections > data sources > loki > settings > additional settings
      maxLines: 1000
